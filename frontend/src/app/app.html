<div class="shell">
  <nav class="nav" aria-label="Navigation principale">
    <a class="brand" routerLink="/analyser" aria-label="Hoe-aona?, accueil">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="brand-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4B4DED" />
            <stop offset=".55" stop-color="#8B5CF6" />
            <stop offset="1" stop-color="#0EA5A4" />
          </linearGradient>
        </defs>
        <path
          d="M12 2c.6 4.8 3.2 7.4 10 10-6.8 2.6-9.4 5.2-10 10-.6-4.8-3.2-7.4-10-10 6.8-2.6 9.4-5.2 10-10z"
          fill="url(#brand-g)"
        />
      </svg>
      <span>Hoe-aona?</span>
    </a>
    @for (item of nav; track item.path) {
    <a
      class="nav-item"
      [routerLink]="item.path"
      routerLinkActive="on"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >
      <span class="pill"><app-icon [name]="item.icon" /></span>
      <span class="label">{{ item.label }}</span>
    </a>
    }
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
