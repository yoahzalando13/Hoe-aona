<div class="shell" [class.guest]="!auth.user()">
  @if (auth.user(); as me) {
  <nav class="nav" aria-label="Navigation principale">
    <a class="brand" routerLink="/fil" aria-label="Hoe-aona?, accueil">
      <img src="logo-hoe-aona.svg" width="28" height="28" alt="" aria-hidden="true" style="object-fit: contain" />
      <span>Hoe-aona?</span>
    </a>
    @for (item of nav(); track item.path) {
    <a
      class="nav-item"
      [routerLink]="item.path"
      routerLinkActive="on"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >
      <span class="pill"><app-icon [name]="item.icon" /></span>
      <span class="label">{{ item.label }}</span>
    </a>
    }
    <div class="me">
      <a class="me-link" [routerLink]="['/profil', me.id]" routerLinkActive="on">
        <span class="avatar" [class]="avatarTone(me.id)">{{ initials(me.display_name) }}</span>
        <span class="me-t">
          <span class="me-n">{{ me.display_name }}</span>
          <span class="me-o">{{ me.organization || (me.role === 'admin' ? 'Administration' : 'Personnel média') }}</span>
        </span>
      </a>
      <button type="button" class="icon-btn" (click)="auth.logout()" aria-label="Se déconnecter" title="Se déconnecter">
        <app-icon name="logout" [size]="19" />
      </button>
    </div>
  </nav>
  }
  <main class="content">
    <router-outlet />
  </main>
</div>
